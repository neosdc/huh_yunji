<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="구구단과 덧셈·뺄셈을 재미있게 익히는 초등학생용 웹 게임">
<title>구구단 놀이터</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* 방안지 위에 한 줄짜리 컬럼. 홈의 주인공은 8×9 구구단 표이고, 단마다 색이 있어 익힐수록 칸이 채워진다. */
:root {
  --paper: #EAF1FB;
  --paper-2: #DCE6F5;
  --grid-line: #D3DFF1;
  --card: #FFFFFF;
  --ink: #1C2745;
  --ink-2: #4A5879;
  --edge: #1C2745;
  --edge-shadow: #1C2745;
  --on-solid: #1C2745;
  --good: #1B7F46;
  --bad: #C2372B;
  --gold: #FFC93C;
  --focus: #2F5BFF;
  --d2: #FF7F6B;
  --d3: #FFB347;
  --d4: #F5D547;
  --d5: #8FD16B;
  --d6: #4FC7A8;
  --d7: #5BB8F0;
  --d8: #9A98F5;
  --d9: #E58ADB;
  --h: var(--d2);
  --font-d: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-b: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10172B; --paper-2: #1B2543; --grid-line: #17203A; --card: #1E2848;
    --ink: #EAF0FF; --ink-2: #A8B5D6; --edge: #8D9BC6; --edge-shadow: #050816;
    --good: #5FD38C; --bad: #FF8A7D; --focus: #8DB2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10172B; --paper-2: #1B2543; --grid-line: #17203A; --card: #1E2848;
  --ink: #EAF0FF; --ink-2: #A8B5D6; --edge: #8D9BC6; --edge-shadow: #050816;
  --good: #5FD38C; --bad: #FF8A7D; --focus: #8DB2FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--font-b);
  font-size: 16px;
  line-height: 1.55;
  padding-inline: 16px;
  padding-block: 16px 48px;
}
.wrap { max-width: 36rem; margin-inline: auto; }
h1, h2, h3, .btn, .chip, .choice, .key, .rowhead, .cell, .eq, .q, .stats b {
  font-family: var(--font-d);
  font-weight: 400;
}
h1 { font-size: 2.2rem; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 1.5rem; margin: 0; line-height: 1.2; }
h3 { font-size: 1.15rem; margin: 0 0 .5rem; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }

.top { display: flex; align-items: center; gap: .75rem; justify-content: space-between; margin-bottom: 1rem; }
.top .title { flex: 1; text-align: center; }
.sub { color: var(--ink-2); margin-top: .35rem; }

.btn {
  font-size: 1.15rem;
  padding: .6rem 1.1rem;
  background: var(--card);
  border: 2.5px solid var(--edge);
  border-radius: 14px;
  box-shadow: 0 4px 0 var(--edge-shadow);
  transition: transform .08s, box-shadow .08s;
  user-select: none;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge-shadow); }
.btn.primary { background: var(--h); color: var(--on-solid); }
.btn.small { font-size: 1rem; padding: .4rem .8rem; }
.btn.wide { width: 100%; }
.icon-btn {
  width: 2.8rem; height: 2.8rem; flex: none;
  display: grid; place-items: center;
  background: var(--card); border: 2.5px solid var(--edge); border-radius: 50%;
  box-shadow: 0 3px 0 var(--edge-shadow);
}
.icon-btn[aria-pressed="false"] { color: var(--ink-2); }

.card {
  background: var(--card);
  border: 2.5px solid var(--edge);
  border-radius: 18px;
  box-shadow: 0 5px 0 var(--edge-shadow);
  padding: 1rem;
}

/* 홈 */
.stats { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; }
.stat {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .2rem .8rem; background: var(--card);
  border: 2px solid var(--edge); border-radius: 999px; font-size: .95rem;
}
.stat b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.board-card { padding: .75rem; }
.board {
  display: grid;
  grid-template-columns: 2.9rem repeat(9, minmax(0, 1fr));
  gap: 3px;
}
.colhead { text-align: center; font-size: .8rem; color: var(--ink-2); align-self: end; padding-bottom: 2px; font-variant-numeric: tabular-nums; }
.rowhead {
  background: var(--c); color: var(--on-solid);
  border: 2px solid var(--edge); border-radius: 10px;
  font-size: .95rem; padding: 0;
}
.rowhead[aria-pressed="true"] { box-shadow: 0 3px 0 var(--edge-shadow); transform: translateY(-1px); }
.cell {
  aspect-ratio: 1;
  display: grid; place-items: center;
  border: 2px solid transparent; border-radius: 8px;
  background: var(--paper-2); color: var(--ink);
  font-size: clamp(.78rem, 3.4vw, 1.05rem);
  font-variant-numeric: tabular-nums;
  position: relative;
}
.cell.insel { border-color: var(--edge); }
.cell.l1 { background: color-mix(in srgb, var(--c) 32%, var(--card)); }
.cell.l2 { background: color-mix(in srgb, var(--c) 64%, var(--card)); }
.cell.l3 { background: var(--c); color: var(--on-solid); }
.cell.l3::after { content: '★'; position: absolute; top: 0; right: 3px; font-size: .5rem; line-height: 1; padding-top: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin: .8rem 0 1rem; font-size: .85rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.legend .cell { width: 1.2rem; font-size: 0; border-radius: 6px; }
.panel { display: flex; flex-direction: column; gap: .8rem; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.panel-head h2 { background: var(--h); color: var(--on-solid); padding: .1rem .7rem; border: 2.5px solid var(--edge); border-radius: 12px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
.challenge { margin-top: 1.25rem; display: flex; flex-direction: column; gap: .5rem; }
.note { color: var(--ink-2); font-size: .9rem; text-align: center; }

.custom { margin-top: 1.25rem; display: flex; flex-direction: column; gap: .8rem; }
.custom h3 { margin: 0; }
.custom .sub { margin: 0; font-size: .9rem; }
.picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; }
.pick {
  min-height: 3rem; padding: .3rem; font-family: var(--font-d); font-size: 1.15rem;
  background: var(--card); color: var(--ink);
  border: 2.5px solid var(--edge); border-radius: 12px;
}
.pick[aria-pressed="true"] { background: var(--c); color: var(--on-solid); box-shadow: 0 3px 0 var(--edge-shadow); transform: translateY(-1px); }
.pick[aria-pressed="true"]::before { content: '✓ '; }
.pick-tools { display: flex; gap: .5rem; }

/* 놀이터 메뉴 */
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; margin-bottom: 1rem; }
.tab {
  font-family: var(--font-d); font-size: 1.05rem; padding: .6rem .2rem; white-space: nowrap;
  background: var(--card); color: var(--ink);
  border: 2.5px solid var(--edge); border-radius: 14px; box-shadow: 0 4px 0 var(--edge-shadow);
}
.tab[aria-pressed="true"] { background: var(--ink); color: var(--card); transform: translateY(3px); box-shadow: 0 1px 0 var(--edge-shadow); }

/* 덧셈·뺄셈 */
#asHome, #mlHome { display: flex; flex-direction: column; gap: 1.1rem; }
#asHome .stats, #mlHome .stats { margin-bottom: 0; }
.box { display: flex; flex-direction: column; gap: .7rem; }
.box h3 { margin: 0; }
.picks.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.lvls { display: flex; flex-direction: column; gap: .5rem; }
.lvl {
  display: flex; align-items: center; gap: .7rem; width: 100%; min-width: 0; text-align: left;
  padding: .55rem .8rem; background: var(--card); color: var(--ink);
  border: 2.5px solid var(--edge); border-radius: 14px;
}
.lvl[aria-pressed="true"] { background: color-mix(in srgb, var(--h) 35%, var(--card)); box-shadow: 0 4px 0 var(--edge-shadow); transform: translateY(-1px); }
.lvbadge {
  flex: none; white-space: nowrap; font-family: var(--font-d); color: var(--on-solid);
  background: var(--h); border: 2px solid var(--edge); border-radius: 10px; padding: .1rem .55rem;
}
.lvl[aria-pressed="true"] .lvbadge::before { content: '✓ '; }
.lvtext { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.lvtext b { font-family: var(--font-d); font-weight: 400; font-size: 1.05rem; }
.lvtext span { color: var(--ink-2); font-size: .9rem; }
.lvstars { display: flex; gap: .1rem; flex: none; }
.nav3 { display: grid; grid-template-columns: 1fr 1.5fr 1.3fr; gap: .6rem; margin: 1rem 0; }
.nav3 .btn { font-size: 1rem; padding: .6rem .3rem; }
.frames { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; }
.frame {
  display: grid; grid-template-columns: repeat(5, 1.6rem); grid-auto-rows: 1.6rem; gap: .25rem; padding: .45rem;
  background: var(--paper-2); border: 2.5px solid var(--edge); border-radius: 12px;
}
.fd { position: relative; border-radius: 50%; border: 2px solid transparent; }
.fd.a { background: var(--h); border-color: var(--edge); animation: pop .3s both; animation-delay: calc(var(--i) * 35ms); }
.fd.b { background: var(--card); border: 4px solid var(--h); box-shadow: 0 0 0 2px var(--edge); animation: pop .3s both; animation-delay: calc(var(--i) * 35ms); }
.fd.gone { border: 2px dashed var(--ink-2); }
.fd.gone::after { content: '×'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.15rem; line-height: 1; color: var(--ink-2); }
.fcap { margin-top: .9rem; text-align: center; font-size: 1.05rem; }
.sw { display: inline-block; width: .95rem; height: .95rem; border-radius: 50%; vertical-align: -.1rem; margin-right: .25rem; border: 2px solid var(--edge); }
.sw.a { background: var(--h); }
.sw.b { background: var(--card); border: 4px solid var(--h); box-shadow: 0 0 0 2px var(--edge); }
.colcalc {
  display: grid; grid-template-columns: 2rem repeat(3, 2.6rem); justify-content: center; row-gap: .1rem;
  font-family: var(--font-d); font-size: 2.2rem; line-height: 1.15; text-align: center; font-variant-numeric: tabular-nums;
}
.colcalc .ch { font-family: var(--font-b); font-size: .8rem; color: var(--ink-2); }
.colcalc .mk { font-size: .85rem; min-height: 1.3rem; white-space: nowrap; color: var(--bad); }
.colcalc .op { color: var(--ink-2); }
.colcalc .rule { grid-column: 1 / -1; height: 3px; margin-block: .15rem; background: var(--ink); border-radius: 2px; }
.colcalc .pp { color: var(--ink); }
.colcalc .pp.z { color: var(--ink-2); opacity: .55; }
.colcalc .res.on { background: var(--h); color: var(--on-solid); border-radius: 8px; }
.steps { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: .4rem; text-align: left; }
.card h3 + .steps { margin-top: 0; }
.steps .sub { margin: .35rem 0 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: .25rem; font-size: .95rem; color: var(--ink-2); list-style: disc; }

/* 배우기 */
.eq-card { text-align: center; }
.eq { display: flex; justify-content: center; align-items: center; gap: .5rem; flex-wrap: wrap; font-size: clamp(2.3rem, 12vw, 3.4rem); line-height: 1.1; font-variant-numeric: tabular-nums; }
.eq .op { color: var(--ink-2); }
.eq .ans { background: var(--h); color: var(--on-solid); padding: 0 .35em; border: 2.5px solid var(--edge); border-radius: 14px; }
.read { margin-top: .5rem; color: var(--ink-2); font-size: 1.05rem; }
.nav { display: grid; grid-template-columns: 1fr auto 1.4fr; gap: .7rem; margin: 1rem 0; }
.viz { display: flex; gap: 1.25rem; align-items: center; justify-content: center; flex-wrap: wrap; }
.dotgrid { display: grid; grid-template-columns: repeat(var(--cols), 1.35rem); gap: .28rem; }
.dot {
  width: 1.35rem; height: 1.35rem; border-radius: 50%;
  background: var(--h); border: 1.5px solid var(--edge);
  animation: pop .3s both; animation-delay: calc(var(--r) * 55ms);
}
.dot.alt { background: color-mix(in srgb, var(--h) 45%, var(--card)); }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.vcap { font-size: 1.05rem; }
.vcap .big { font-family: var(--font-d); font-size: 1.6rem; line-height: 1.25; }
.skip, .tip { margin-top: 1rem; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  min-width: 2.7rem; padding: .3rem .6rem;
  background: var(--card); border: 2px solid var(--edge); border-radius: 10px;
  font-size: 1.05rem; text-align: center; font-variant-numeric: tabular-nums;
}
.chip.cur { background: var(--h); color: var(--on-solid); }
.chip.future { border-style: dashed; color: var(--ink-2); }
span.chip { cursor: default; }
.tip p:last-child { margin-top: .2rem; }

/* 문제 */
.prog { flex: 1; height: 1rem; border: 2.5px solid var(--edge); border-radius: 999px; background: var(--card); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--h); transition: width .3s; }
.meta { display: flex; justify-content: space-between; color: var(--ink-2); font-size: .95rem; margin-bottom: .6rem; font-variant-numeric: tabular-nums; }
.streak { visibility: hidden; color: var(--ink); }
.streak.on { visibility: visible; }
.timer { display: flex; align-items: center; gap: .6rem; margin-bottom: .8rem; }
.tlabel { font-size: .9rem; color: var(--ink-2); white-space: nowrap; }
.timer .bar { flex: 1; min-width: 0; height: .9rem; background: var(--card); border: 2.5px solid var(--edge); border-radius: 999px; overflow: hidden; }
.timer .bar i { display: block; height: 100%; width: 100%; background: var(--h); }
.timer b { font-family: var(--font-d); font-weight: 400; font-size: 1.5rem; line-height: 1; min-width: 1.2ch; text-align: right; font-variant-numeric: tabular-nums; }
.timer.low .bar i { background: var(--bad); }
.timer.low b { color: var(--bad); }
.q-card { text-align: center; padding-block: 1.4rem; }
.q { display: flex; justify-content: center; align-items: center; gap: .6rem; flex-wrap: wrap; font-size: clamp(2.6rem, 14vw, 4rem); line-height: 1.1; font-variant-numeric: tabular-nums; }
.q .op { color: var(--ink-2); }
.q.sm { font-size: clamp(2.2rem, 11vw, 3.4rem); gap: .45rem; }
.q.sm.xl { font-size: clamp(1.9rem, 9.5vw, 3rem); }
.eq.sm { font-size: clamp(1.9rem, 9.5vw, 2.8rem); }
.read .lvbadge { margin-right: .4rem; font-size: .9rem; }
.blank { min-width: 1.6em; padding: 0 .25em; border-bottom: 4px solid var(--edge); }
.blank.good { color: var(--good); border-color: var(--good); }
.blank.bad { color: var(--bad); border-color: var(--bad); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin-top: 1rem; }
.choice {
  position: relative; min-height: 4.4rem; font-size: 2.1rem;
  background: var(--card); border: 2.5px solid var(--edge); border-radius: 16px;
  box-shadow: 0 4px 0 var(--edge-shadow); font-variant-numeric: tabular-nums;
  transition: transform .08s, box-shadow .08s;
}
.choice:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge-shadow); }
.choice kbd { position: absolute; top: .3rem; left: .5rem; font: .75rem var(--font-b); color: var(--ink-2); }
.choice.good { background: var(--good); color: var(--card); border-color: var(--good); opacity: 1; }
.choice.bad { background: var(--bad); color: var(--card); border-color: var(--bad); opacity: 1; }
.choice:disabled { opacity: .55; }
@media (hover: none) { .choice kbd { display: none; } }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-top: 1rem; }
.key {
  min-height: 3.6rem; font-size: 1.7rem;
  background: var(--card); border: 2.5px solid var(--edge); border-radius: 14px;
  box-shadow: 0 4px 0 var(--edge-shadow);
}
.key:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge-shadow); }
.key.go { background: var(--h); color: var(--on-solid); font-size: 1.3rem; }
.key.bk { font-size: 1.3rem; }
.feedback { margin-top: 1rem; min-height: 3rem; }
.fb { display: flex; flex-direction: column; gap: .6rem; }
.fb-line { font-family: var(--font-d); font-size: 1.4rem; }
.fb-line.good { color: var(--good); }
.fb-line.bad { color: var(--bad); }

/* 결과 */
.result { text-align: center; display: flex; flex-direction: column; gap: .8rem; align-items: center; }
.stars { display: flex; gap: .4rem; }
.stars .star { width: 3.6rem; height: 3.6rem; }
.stars .star.on { animation: pop .45s both; animation-delay: calc(var(--n) * 160ms); }
.star { width: 1.2rem; height: 1.2rem; fill: var(--paper-2); stroke: var(--edge); stroke-width: 1.5; stroke-linejoin: round; }
.star.on { fill: var(--gold); }
.miss-list { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; }
.row { display: flex; flex-wrap: wrap; gap: .7rem; justify-content: center; margin-top: .4rem; }

@media (prefers-reduced-motion: reduce) {
  .dot, .fd, .stars .star.on { animation: none; }
  .prog i, .btn, .choice { transition: none; }
}

body { margin: 0; }

.nyang { flex: none; width: var(--ny, 58px); aspect-ratio: 300 / 275; background: var(--nyang) center / contain no-repeat; }
.nyang-row.sm { --ny: 116px; min-height: 116px; margin-bottom: .5rem; }

.nyang-row.lg { --ny: 92px; margin-bottom: .9rem; }
.nyang-row.res { --ny: 120px; justify-content: center; margin-bottom: .2rem; }
.bubble {
  position: relative; min-width: 0; max-width: calc(100% - var(--ny, 58px) - .9rem); padding: .45rem .85rem;
  background: var(--card); color: var(--ink); border: 2.5px solid var(--edge); border-radius: 14px; box-shadow: 0 3px 0 var(--edge-shadow);
  font-family: var(--font-d); font-size: 1.1rem; line-height: 1.3; text-align: left; word-break: keep-all;
}
.bubble::before {
  content: ''; position: absolute; left: -8px; top: 50%; width: 12px; height: 12px; background: var(--card);
  border-left: 2.5px solid var(--edge); border-bottom: 2.5px solid var(--edge); transform: translateY(-50%) rotate(45deg);
}
.bubble.say { animation: bubbleIn .25s ease-out both; transform-origin: left center; }
@keyframes bubbleIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.nyang-row.float { animation: floaty 3.6s ease-in-out infinite; }
@keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-12px) rotate(1.5deg); } }
@media (prefers-reduced-motion: reduce) { .nyang-row.float, .bubble.say { animation: none; } }

    var ao = a % 10;
    var base, other, need, rest;
    if (add && a < 10 && b < 10) {

      base = Math.max(a, b); other = Math.min(a, b); need = 10 - base; rest = other - need;
      return [
        base + '에 ' + jo(need, '을', '를') + ' 더하면 10이 돼요.',

        jo(a, '을', '를') + ' 10과 ' + ro(ao) + ' 나눠요.',
        '먼저 10에서 ' + jo(b, '을', '를') + ' 빼요: 10 − ' + b + ' = ' + (10 - b),
        '남은 ' + jo(ao, '을', '를') + ' 더해요: ' + (10 - b) + ' + ' + ao + ' = ' + r

    /* 자리별 계산 (일, 십, 백) */
    var a1 = a % 10, b1 = b % 10, a2 = Math.floor(a / 10) % 10, b2 = Math.floor(b / 10) % 10;
    var a3 = Math.floor(a / 100), b3 = Math.floor(b / 100), big = a >= 100 || b >= 100, s = [];
    if (add) {
      var c1 = a1 + b1 >= 10 ? 1 : 0, s2 = a2 + b2 + c1, c2 = s2 >= 10 ? 1 : 0;
      s.push('일의 자리끼리 더해요: ' + a1 + ' + ' + b1 + ' = ' + (a1 + b1) + (c1 ? '. 10이 넘어서 십의 자리로 1을 올려요.' : ''));
      s.push('십의 자리끼리 더해요: ' + a2 + ' + ' + b2 + (c1 ? ' + 1' : '') + ' = ' + s2 + (c2 ? '. 10이 넘어서 백의 자리로 1을 올려요.' : ''));
      if (big) s.push('백의 자리끼리 더해요: ' + a3 + ' + ' + b3 + (c2 ? ' + 1' : '') + ' = ' + (a3 + b3 + c2));

        ? a1 + '에서 ' + jo(b1, '을', '를') + ' 뺄 수 없어서 십의 자리에서 10을 빌려요: ' + (a1 + 10) + ' − ' + b1 + ' = ' + r1
        : '일의 자리끼리 빼요: ' + a1 + ' − ' + b1 + ' = ' + r1);

        s.push(prefix + t + '에서 ' + jo(b2, '을', '를') + ' 뺄 수 없어서 백의 자리에서 10을 빌려요: ' + (t + 10) + ' − ' + b2 + ' = ' + (t + 10 - b2));

          ? '십의 자리는 1을 빌려줘서 ' + jo(t, '이', '가') + ' 돼요: ' + t + ' − ' + b2 + ' = ' + (t - b2)

      s.push(br2
        ? '백의 자리는 1을 빌려줘서 ' + jo(h3, '이', '가') + ' 돼요: ' + h3 + ' − ' + b3 + ' = ' + (h3 - b3)

  function makeChoicesQ(q) {

    while (set.length < 4) {

  }

  function newAL() {

  /* ---------- 곱셈 놀이터 (여러 자리 수 곱셈, 제한 시간 없음) ---------- */
  var ML = null;
  var LVM = [null,
    ['두 자리 × 한 자리', '올림 없음 · 21 × 4'],
    ['두 자리 × 한 자리', '올림 있음 · 47 × 6'],
    ['세 자리 × 한 자리', '328 × 7'],
    ['두 자리 × 두 자리', '36 × 47'],
    ['세 자리 × 두 자리', '248 × 57']];
  var TIPSML = [null,
    '일의 자리와 십의 자리에 각각 곱해서 나란히 쓰면 돼요. 21 × 4는 20 × 4 = 80과 1 × 4 = 4를 더한 84예요.',
    '곱해서 10이 넘으면 윗자리로 올려요. 올린 수는 윗자리를 곱한 뒤에 더해야 해요.',
    '일의 자리, 십의 자리, 백의 자리 순서로 곱해요. 올림이 생기면 바로 윗자리에서 더해 주세요.',
    '곱하는 수를 일의 자리와 십의 자리로 나눠서 두 번 곱해요. 십의 자리를 곱한 값은 한 칸 왼쪽으로 옮겨서(뒤에 0을 붙여서) 더해요.',
    '먼저 일의 자리를 곱하고, 다음에 십의 자리를 곱해요. 두 번째 줄은 맨 끝에 0을 붙이는 걸 잊지 마세요.'];
  var LABM = ['일', '십', '백', '천', '만'];

  function genMLOne(lv) {
    var a, b, t, u;
    if (lv === 1) { b = rnd(2, 4); t = rnd(1, Math.floor(9 / b)); u = rnd(1, Math.floor(9 / b)); a = t * 10 + u; }
    else if (lv === 2) { do { a = rnd(12, 99); b = rnd(2, 9); } while (a % 10 === 0 || ((a % 10) * b < 10 && Math.floor(a / 10) * b < 10)); }
    else if (lv === 3) { do { a = rnd(101, 999); } while (a % 10 === 0); b = rnd(2, 9); }
    else if (lv === 4) { do { a = rnd(12, 99); } while (a % 10 === 0); do { b = rnd(12, 99); } while (b % 10 === 0); }
    else { do { a = rnd(101, 999); } while (a % 10 === 0); do { b = rnd(12, 99); } while (b % 10 === 0); }
    return [a, b, 'x', lv];
  }
  function genML(lv, n) {
    var out = [], seen = {}, tries = 0, l, f, k;
    while (out.length < n && tries++ < 500) {
      l = Array.isArray(lv) ? lv[rnd(0, lv.length - 1)] : (lv || rnd(1, 5));
      f = genMLOne(l);
      k = f.join('_');
      if (!seen[k]) { seen[k] = 1; out.push(f); }
    }
    return out;
  }

  /* 한 자리 수 d를 곱하는 과정 (자리별) */
  function mulDigits(a, d) {
    var steps = [], c = 0, k, v, dg, txt, len = String(a).length;
    for (k = 0; k < len; k++) {
      dg = Math.floor(a / Math.pow(10, k)) % 10;
      v = dg * d + c;
      txt = LABM[k] + '의 자리: ' + dg + ' × ' + d + (c ? ' + ' + c + '(올림)' : '') + ' = ' + v;
      if (k < len - 1) {
        txt += v >= 10
          ? '. ' + jo(v % 10, '을', '를') + ' 쓰고 ' + jo(Math.floor(v / 10), '을', '를') + ' 올려요.'
          : '. ' + jo(v, '을', '를') + ' 써요.';
      } else {
        txt += '. ' + jo(v, '을', '를') + ' 그대로 써요.';
      }
      steps.push(txt);
      c = Math.floor(v / 10);
    }
    return steps;
  }
  function explainML(q) {
    var a = q.a, b = q.b, r = a * b, s;
    if (b < 10) {
      s = mulDigits(a, b);
      s.push(a + ' × ' + b + ' = ' + r);
      return s;
    }
    var u = b % 10, t = Math.floor(b / 10), p1 = a * u, p2 = a * t;
    return [
      { t: '먼저 ' + a + '에 일의 자리 ' + jo(u, '을', '를') + ' 곱해요: ' + a + ' × ' + u + ' = ' + p1, sub: u > 1 ? mulDigits(a, u) : null },
      { t: '다음은 십의 자리 ' + jo(t, '을', '를') + ' 곱해요. 실제로는 ' + jo(t * 10, '을', '를') + ' 곱하는 것이라서 ' + a + ' × ' + t + ' = ' + p2 + ' 뒤에 0을 붙여 ' + jo(p2 * 10, '이', '가') + ' 돼요.', sub: t > 1 ? mulDigits(a, t) : null },
      '두 결과를 더해요: ' + p1 + ' + ' + (p2 * 10) + ' = ' + r
    ];
  }

  function makeChoicesML(q) {
    var a = q.a, b = q.b, p = a * b, set = [p], c = [], k, i, v, u = b % 10, t = Math.floor(b / 10);
    for (k = 1; k <= String(p).length - 1; k++) c.push(p + Math.pow(10, k), p - Math.pow(10, k));
    c.push(p + a, p - a, p + 1, p - 1);
    if (b >= 10) c.push(a * u + a * t, a * u + a * t * 10 + a, a * t * 10 + a * u * 10);
    shuffle(c);
    for (i = 0; i < c.length && set.length < 4; i++) {
      v = c[i];
      if (v > 0 && set.indexOf(v) < 0) set.push(v);
    }
    while (set.length < 4) {
      v = p + rnd(-30, 30);
      if (v > 0 && set.indexOf(v) < 0) set.push(v);
    }
    return shuffle(set);
  }

  function columnML(q) {
    var a = q.a, b = q.b, r = a * b, two = b >= 10, n = String(r).length;
    var cr = [], c = 0, k, v, head = '', marks = '', mk = [];
    function pad(str) { while (str.length < n) str = ' ' + str; return str.split(''); }
    function cells(arr, cls, zlast) {
      return arr.map(function (ch, i) {
        return '<span class="' + cls + (cls === 'res' && ch !== ' ' ? ' on' : '') + (zlast && i === arr.length - 1 ? ' z' : '') + '">' + (ch === ' ' ? '' : ch) + '</span>';
      }).join('');

    if (!two) {
      for (k = 0; k < String(a).length; k++) {

      }

  /* ---------- 문제 ---------- */
  var S = null;

  function pickWeighted(n, dans) {
    var pool = [], a, b, i0;
    dans = dans || [2, 3, 4, 5, 6, 7, 8, 9];
    for (i0 = 0; i0 < dans.length; i0++) for (a = dans[i0], b = 1; b <= 9; b++) pool.push({ a: a, b: b, w: [8, 4, 2, 1][lvl(a, b)] * (b === 1 ? 0.4 : 1) });
    var out = [];
    while (out.length < n && pool.length) {
      var tot = pool.reduce(function (s, x) { return s + x.w; }, 0);
      var r = Math.random() * tot, i = 0;
      for (; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) break; }
      i = Math.min(i, pool.length - 1);
      out.push([pool[i].a, pool[i].b]);
      pool.splice(i, 1);
    }
    return out;
  }

  function makeChoices(a, b) {
    var p = a * b, set = [p];
    var c = shuffle([p + a, p - a, p + b, p - b, a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b,
      Number(String(p).split('').reverse().join('')), p + 1, p - 1, p + 10, p - 10]);
    for (var i = 0; i < c.length && set.length < 4; i++) {
      if (c[i] > 0 && c[i] <= 90 && set.indexOf(c[i]) < 0) set.push(c[i]);
    }
    while (set.length < 4) {
      var v = 1 + Math.floor(Math.random() * 81);
      if (set.indexOf(v) < 0) set.push(v);
    }
    return shuffle(set);
  }

  function startSession(opts) {
    var facts, b;
    if (opts.facts) facts = opts.facts.slice();
    else if (opts.kind === 'as') facts = genAS(opts.op, opts.lvs || opts.lv, 10);
    else if (opts.kind === 'ml') facts = genML(opts.lvs || opts.lv, 10);
    else if (opts.mode === 'practice') {
      facts = [];
      for (b = 1; b <= 9; b++) facts.push([opts.dan, b]);
      var fresh = facts.every(function (f) { return lvl(f[0], f[1]) === 0; });
      if (!fresh) shuffle(facts);
    } else facts = pickWeighted(opts.dans ? Math.min(10, opts.dans.length * 9) : 10, opts.dans);
    S = {
      opts: opts, mode: opts.mode,
      queue: facts.map(function (f) { return { a: f[0], b: f[1], op: f[2] || '*', lv: f[3] || 0, re: 0, first: true }; }),
      idx: 0, total: facts.length, ok: 0, miss: [], streak: 0, best: 0,
      t0: Date.now(), locked: false, input: '', timer: null,
      raf: 0, left: 0, deadline: 0, lockedAt: 0, late: 0,
      limit: 5000, maxLen: opts.kind === 'ml' ? 5 : opts.kind === 'as' ? 4 : 2
    };
    show('quiz');
    renderQuiz();
  }

  function renderQuiz() {
    var q = S.queue[S.idx];
    S.locked = false; S.input = ''; S.slowSaid = false;
    setHue(hueOf(q));
    if (!q.opts && S.mode === 'practice') q.opts = makeChoicesQ(q);
    var pct = Math.round(S.idx / S.queue.length * 100);
    var h =
      '<header class="top"><button class="btn small" data-act="home">← 그만하기</button>' +
      '<div class="prog" role="progressbar" aria-label="진행" aria-valuemin="0" aria-valuemax="' + S.queue.length + '" aria-valuenow="' + S.idx + '"><i style="width:' + pct + '%"></i></div>' + sndBtn() + '</header>' +
      '<div class="meta"><span>' + (S.idx + 1) + ' / ' + S.queue.length + (S.opts.dans ? ' · ' + S.opts.dans.join('·') + '단' : S.opts.kind === 'ml' ? ' · 곱셈' + (S.opts.lvs ? ' ' + S.opts.lvs.join('·') + '단계' : S.opts.lv ? ' ' + S.opts.lv + '단계' : '') : S.opts.kind === 'as' ? ' · ' + (S.opts.op === 'm' ? '섞어서' : OPN[S.opts.op]) + (S.opts.lvs ? ' ' + S.opts.lvs.join('·') + '단계' : S.opts.lv ? ' ' + S.opts.lv + '단계' : '') : '') + '</span><span class="streak' + (S.streak >= 2 ? ' on' : '') + '">연속 ' + S.streak + '번 맞힘</span></div>' +
      (limitOf(q) ? '<div class="timer" id="tbox" aria-hidden="true"><span class="tlabel">남은 시간</span><div class="bar"><i id="tbar"></i></div><b id="tnum">5</b></div>' : '') +
      (opOf(q) === '*' ? nyRow('sm', '', 'nyBubble') : '') +
      '<div class="card q-card"><div class="q' + (opOf(q) === '*' ? '' : ' sm' + (q.lv >= 5 || q.op === 'x' ? ' xl' : '')) + '"><span>' + q.a + '</span><span class="op">' + sym(q) + '</span><span>' + q.b + '</span><span class="op">=</span><span class="blank" id="blank" aria-live="polite">?</span></div></div>';
    if (S.mode === 'practice') {
      h += '<div class="choices">' + q.opts.map(function (v, i) {
        return '<button class="choice" data-v="' + v + '"><kbd>' + (i + 1) + '</kbd>' + v + '</button>';
      }).join('') + '</div>';
    } else {
      var keys = '';
      for (var n = 1; n <= 9; n++) keys += '<button class="key" data-key="' + n + '">' + n + '</button>';
      keys += '<button class="key bk" data-key="bk" aria-label="지우기">지움</button><button class="key" data-key="0">0</button><button class="key go" data-key="ok">확인</button>';
      h += '<div class="keypad">' + keys + '</div>';
    }
    h += '<div class="feedback" id="fb" aria-live="polite"></div>';
    $('#quiz').innerHTML = h;
    startTimer();
  }

  function skipChips(a, b) {
    var s = '';
    for (var k = 1; k <= b; k++) s += '<span class="chip' + (k === b ? ' cur' : '') + '">' + (a * k) + '</span>';
    return s;
  }

  function answer(val, btn, timedOut) {
    if (!S || S.locked) return;
    var q = S.queue[S.idx], p = calc(q), ok = !timedOut && val === p;
    S.locked = true;
    S.lockedAt = Date.now();
    stopTimer();
    if (timedOut) S.late++;
    if (q.first) {
      var isMul = opOf(q) === '*';
      var cap = S.mode === 'challenge' ? 3 : 2, cur = isMul ? lvl(q.a, q.b) : 0;
      if (ok) {
        S.ok++;
        if (isMul) setLvl(q.a, q.b, Math.max(cur, Math.min(cap, cur + 1)));
        else if (q.op === 'x') store.ml.solved++;
        else store.as.solved++;
      } else {
        S.miss.push([q.a, q.b, q.op, q.lv]);
        if (isMul) setLvl(q.a, q.b, Math.max(0, cur - 1));
      }
      save();
    }
    var blank = $('#blank');
    blank.textContent = ok ? p : timedOut ? (S.input || '?') : (S.mode === 'challenge' ? S.input : val);
    blank.className = 'blank ' + (ok ? 'good' : 'bad');
    if (opOf(q) === '*') nySay(ok ? 'ok' : 'bad');
    var list = document.querySelectorAll('.choice, .key');
    for (var i = 0; i < list.length; i++) {
      list[i].disabled = true;
      if (list[i].classList.contains('choice')) {
        if (+list[i].dataset.v === p) list[i].classList.add('good');
        else if (list[i] === btn) list[i].classList.add('bad');
      }
    }
    if (ok) {
      S.streak++; S.best = Math.max(S.best, S.streak);
      tone([660, 880]);
      $('#fb').innerHTML = '<p class="fb-line good">맞았어요</p>';
      S.timer = setTimeout(next, 900);
    } else {
      S.streak = 0;
      tone([220, 196], 0.18, 'triangle');
      if (q.re < 2) S.queue.splice(Math.min(S.idx + 4, S.queue.length), 0, { a: q.a, b: q.b, op: q.op, lv: q.lv, re: q.re + 1, first: false });
      $('#fb').innerHTML =
        '<div class="fb"><p class="fb-line bad">' + (timedOut ? '시간이 끝났어요. ' : '아쉬워요. ') + q.a + ' ' + sym(q) + ' ' + q.b + ' = ' + p + '</p>' +
        hintHtml(q) +
        '<button class="btn primary" id="nextBtn" data-act="nextq">다음 문제</button></div>';
      speak(readQ(q));
      var nb = $('#nextBtn'); if (nb) nb.focus({ preventScroll: true });
    }
  }

  /* ---------- 5초 제한 ---------- */
  function paintTimer() {
    var bar = $('#tbar'), num = $('#tnum'), box = $('#tbox');
    if (!bar || !S) return;
    bar.style.width = (S.left / S.limit * 100) + '%';
    num.textContent = Math.ceil(S.left / 1000);
    box.classList.toggle('low', S.left <= 2000);
  }
  function stopTimer() {
    if (S && S.raf) { cancelAnimationFrame(S.raf); S.raf = 0; }
  }
  function tick() {
    if (!S || S.locked) return;
    S.left = S.deadline - performance.now();
    if (!S.slowSaid && S.limit && S.left <= S.limit / 2 && opOf(S.queue[S.idx]) === '*') { S.slowSaid = true; nySay('slow'); }
    if (S.left <= 0) { S.left = 0; paintTimer(); answer(null, null, true); return; }
    paintTimer();
    S.raf = requestAnimationFrame(tick);
  }
  function startTimer() {
    stopTimer();
    S.limit = limitOf(S.queue[S.idx]);
    if (!S.limit) { S.left = 0; return; }   /* 제한 시간 없음 */
    S.left = S.limit;
    S.deadline = performance.now() + S.limit;
    paintTimer();
    S.raf = requestAnimationFrame(tick);
  }
  /* 다른 탭으로 나가 있는 동안에는 시간이 흐르지 않는다 */
  document.addEventListener('visibilitychange', function () {
    if (!S || S.locked || !S.limit || $('#quiz').hidden) return;
    if (document.hidden) {
      stopTimer();
      S.left = Math.max(0, S.deadline - performance.now());
    } else if (!S.raf) {
      S.deadline = performance.now() + S.left;
      S.raf = requestAnimationFrame(tick);
    }
  });

  function next() {
    if (!S) return;
    clearTimeout(S.timer);
    S.idx++;
    if (S.idx >= S.queue.length) return finish();
    renderQuiz();
  }

  function keypad(k) {
    if (!S || S.locked) return;
    if (k === 'bk') S.input = S.input.slice(0, -1);
    else if (k === 'ok') { if (S.input) answer(+S.input); return; }
    else if (S.input.length < S.maxLen && !(S.input === '' && k === '0')) S.input += k;
    $('#blank').textContent = S.input || '?';
  }

  function finish() {
    var n = S.total, ratio = n ? S.ok / n : 0;
    var stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : 1;
    store.stars += stars;
    if (S.opts.kind === 'as' && !S.opts.facts && !S.opts.lvs) {
      var bk = S.opts.op + ':' + S.opts.lv;
      store.as.best[bk] = Math.max(store.as.best[bk] || 0, stars);
    }
    if (S.opts.kind === 'ml' && !S.opts.facts && !S.opts.lvs) store.ml.best[S.opts.lv] = Math.max(store.ml.best[S.opts.lv] || 0, stars);
    save();
    tone([523, 659, 784, 1047], 0.14);
    var sec = Math.round((Date.now() - S.t0) / 1000);
    var uniq = [], seen = {};
    S.miss.forEach(function (f) { var k = f.join('x'); if (!seen[k]) { seen[k] = 1; uniq.push(f); } });
    S.missUniq = uniq;
    var head = stars === 3 ? '모두 알고 있어요' : stars === 2 ? '거의 다 왔어요' : '조금만 더 익혀요';
    var missHtml = uniq.length
      ? '<div><h3>' + (uniq[0][2] ? '다시 볼 문제' : '다시 볼 구구단') + '</h3><div class="miss-list">' + uniq.map(function (f) { return '<span class="chip">' + factText(f) + '</span>'; }).join('') + '</div></div>'
      : '';
    $('#result').innerHTML =
      '<header class="top"><span></span><span></span>' + sndBtn() + '</header>' +
      '<div class="card result">' +
        (S.queue[0] && opOf(S.queue[0]) === '*' ? nyResult(S.ok, n) : '') +
        '<div class="stars">' + starSvg(stars >= 1, 0) + starSvg(stars >= 2, 1) + starSvg(stars >= 3, 2) + '</div>' +
        '<h2>' + head + '</h2>' +
        '<p>' + n + '문제 중 ' + S.ok + '문제를 한 번에 맞혔어요.</p>' +
        '<p class="note">걸린 시간 ' + sec + '초 · 가장 길게 이어서 맞힌 횟수 ' + S.best + '번' + (S.late ? ' · 시간이 끝난 문제 ' + S.late + '번' : '') + '</p>' +
        missHtml +
        '<div class="row">' +
          '<button class="btn primary" data-act="again">다시 하기</button>' +
          (uniq.length ? '<button class="btn" data-act="missed">틀린 것 연습</button>' : '') +
          '<button class="btn" data-act="home">처음으로</button>' +
        '</div>' +
      '</div>';
    show('result');
  }

  /* ---------- 이벤트 ---------- */
  $('#app').addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t || t.disabled) return;
    var act = t.dataset.act;
    if (act === 'home') renderHome();
    else if (act === 'snd') { store.sound = !store.sound; save(); if (!store.sound) hush(); paintSnd(); }
    else if (act === 'learn') startLearn(store.sel);
    else if (act === 'practice') startSession({ mode: 'practice', dan: store.sel });
    else if (act === 'challenge') startSession({ mode: 'challenge' });
    else if (act === 'prev') { if (L.step > 1) { L.step--; renderLearn(true); } }
    else if (act === 'next') {
      if (L.step < 9) { L.step++; renderLearn(true); }
      else startSession({ mode: 'practice', dan: L.a });
    }
    else if (act === 'hear') { var was = store.sound; store.sound = true; speak(reading(L.a, L.step)); store.sound = was; }
    else if (act === 'nextq') next();
    else if (act === 'again') startSession(S.opts);
    else if (act === 'missed') startSession({ mode: 'practice', facts: S.missUniq });
    else if (act === 'as-learn') startLearnAS();
    else if (act === 'as-practice') startSession({ mode: 'practice', kind: 'as', op: store.as.op, lv: store.as.lv });
    else if (act === 'as-challenge') startSession({ mode: 'challenge', kind: 'as', op: store.as.op, lv: store.as.lv });
    else if (act === 'as-go') startSession({ mode: 'practice', kind: 'as', op: store.as.op, lv: store.as.lv });
    else if (act === 'as-other') { newAL(); renderLearnAS(true); }
    else if (act === 'as-custom') { if (store.as.custom.length) startSession({ mode: 'challenge', kind: 'as', op: store.as.op, lvs: store.as.custom.slice() }); }
    else if (act === 'as-pickall') { store.as.custom = [1, 2, 3, 4, 5, 6]; save(); renderAS(); }
    else if (act === 'as-pickclear') { store.as.custom = []; save(); renderAS(); }
    else if (act === 'as-hear') { var wasAs = store.sound; store.sound = true; speak(readQ(AL.q)); store.sound = wasAs; }
    else if (act === 'ml-learn') startLearnML();
    else if (act === 'ml-practice' || act === 'ml-go') startSession({ mode: 'practice', kind: 'ml', lv: store.ml.lv });
    else if (act === 'ml-challenge') startSession({ mode: 'challenge', kind: 'ml', lv: store.ml.lv });
    else if (act === 'ml-other') { newML(); renderLearnML(true); }
    else if (act === 'ml-hear') { var wasMl = store.sound; store.sound = true; speak(readQ(ML.q)); store.sound = wasMl; }
    else if (act === 'ml-custom') { if (store.ml.custom.length) startSession({ mode: 'challenge', kind: 'ml', lvs: store.ml.custom.slice() }); }
    else if (act === 'ml-pickall') { store.ml.custom = [1, 2, 3, 4, 5]; save(); renderML(); }
    else if (act === 'ml-pickclear') { store.ml.custom = []; save(); renderML(); }
    else if (act === 'custom') { if (store.custom.length) startSession({ mode: 'challenge', dans: store.custom.slice() }); }
    else if (act === 'pickall') { store.custom = [2, 3, 4, 5, 6, 7, 8, 9]; save(); renderCustom(); }
    else if (act === 'pickclear') { store.custom = []; save(); renderCustom(); }
    else if (t.dataset.pick) {
      var d = +t.dataset.pick, ix = store.custom.indexOf(d);
      if (ix >= 0) store.custom.splice(ix, 1);
      else { store.custom.push(d); store.custom.sort(function (x, y) { return x - y; }); }
      save(); renderCustom();
      var again = document.querySelector('.pick[data-pick="' + d + '"]');
      if (again) again.focus({ preventScroll: true });
    }
    else if (t.dataset.lvpick) {
      var lp = +t.dataset.lvpick, lpi = store.as.custom.indexOf(lp);
      if (lpi >= 0) store.as.custom.splice(lpi, 1);
      else { store.as.custom.push(lp); store.as.custom.sort(function (x, y) { return x - y; }); }
      save(); renderAS();
      var lpBtn = document.querySelector('[data-lvpick="' + lp + '"]');
      if (lpBtn) lpBtn.focus({ preventScroll: true });
    }
    else if (t.dataset.mlvpick) {
      var mp = +t.dataset.mlvpick, mpi = store.ml.custom.indexOf(mp);
      if (mpi >= 0) store.ml.custom.splice(mpi, 1);
      else { store.ml.custom.push(mp); store.ml.custom.sort(function (x, y) { return x - y; }); }
      save(); renderML();
      var mpBtn = document.querySelector('[data-mlvpick="' + mp + '"]');
      if (mpBtn) mpBtn.focus({ preventScroll: true });
    }
    else if (t.dataset.mlv) {
      var mlSel = +t.dataset.mlv;
      store.ml.lv = mlSel; save(); renderML();
      var mlBtn = document.querySelector('.lvl[data-mlv="' + mlSel + '"]');
      if (mlBtn) mlBtn.focus({ preventScroll: true });
    }
    else if (t.dataset.tab) { store.tab = t.dataset.tab; save(); renderHome(); }
    else if (t.dataset.op) {
      var opSel = t.dataset.op;
      store.as.op = opSel; save(); renderAS();
      var opBtn = document.querySelector('[data-op="' + opSel + '"]');
      if (opBtn) opBtn.focus({ preventScroll: true });
    }
    else if (t.dataset.lv) {
      var lvSel = +t.dataset.lv;
      store.as.lv = lvSel; save(); renderAS();
      var lvBtn = document.querySelector('.lvl[data-lv="' + lvSel + '"]');
      if (lvBtn) lvBtn.focus({ preventScroll: true });
    }
    else if (t.dataset.dan) { store.sel = +t.dataset.dan; save(); renderHome(); }
    else if (t.dataset.k && t.closest('#learn')) { L.step = +t.dataset.k; renderLearn(true); }
    else if (t.classList.contains('choice')) answer(+t.dataset.v, t);
    else if (t.dataset.key) keypad(t.dataset.key);
  });

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!$('#quiz').hidden && S) {
      if (S.locked) {
        if (e.key === 'Enter') { e.preventDefault(); if (Date.now() - S.lockedAt > 400) next(); }
        return;
      }
      if (S.mode === 'practice') {
        var i = '1234'.indexOf(e.key);
        if (i >= 0) { var b = document.querySelectorAll('.choice')[i]; if (b) { e.preventDefault(); answer(+b.dataset.v, b); } }
      } else if (/^[0-9]$/.test(e.key)) { e.preventDefault(); keypad(e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); keypad('bk'); }
      else if (e.key === 'Enter') { e.preventDefault(); keypad('ok'); }
    } else if (!$('#learn').hidden && learnKind === 'mul') {
      if (e.key === 'ArrowRight' && L.step < 9) { L.step++; renderLearn(true); }
      else if (e.key === 'ArrowLeft' && L.step > 1) { L.step--; renderLearn(true); }
    }
  });

  renderHome();
})();
</script>

</body>
</html>
