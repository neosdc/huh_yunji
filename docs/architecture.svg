        <rect x="700" y="316" width="236" height="64" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" fill-opacity="0.05"/>
        <rect x="708" y="324" width="32" height="12" rx="2" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="724" y="333" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
        <text x="818" y="356" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">천만냥냥 음성 파일</text>
        <text x="818" y="372" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Storage · protected-assets</text>

