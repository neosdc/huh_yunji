        <rect x="40" y="232" width="128" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="232" width="128" height="64" rx="6" fill="#bfc0c0" stroke="#949eb2" stroke-width="1" fill-opacity="0.10"/>
