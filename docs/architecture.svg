        <text x="300" y="188" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">놀이터 모듈</text>
        <text x="300" y="204" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">phonics·hangul·dashboard</text>

