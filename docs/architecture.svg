        <rect x="424" y="28" width="152" height="56" rx="6" fill="#2d3142"/>
        <rect x="424" y="28" width="152" height="56" rx="6" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
