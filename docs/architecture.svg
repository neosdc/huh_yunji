        <text x="500" y="62" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">정적 호스팅</text>
        <text x="500" y="76" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitHub Pages</text>

