        <line x1="168" y1="264" x2="424" y2="264" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <!-- Host -> App -->
        <line x1="500" y1="84" x2="500" y2="232" stroke="#739fdf" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <!-- App -> Modules -->
        <path d="M 424,248 H 408 Q 400,248 400,240 V 188 Q 400,180 392,180 H 376" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <!-- App -> Voice -->
        <path d="M 424,280 H 408 Q 400,280 400,288 V 340 Q 400,348 392,348 H 376" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
