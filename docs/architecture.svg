        <text x="530" y="161" fill="#739fdf" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOAD</text>

        <rect x="648" y="162" width="44" height="12" rx="2" fill="#2d3142"/>
        <text x="670" y="171" fill="#739fdf" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OAUTH</text>

        <rect x="648" y="246" width="40" height="12" rx="2" fill="#2d3142"/>
        <text x="668" y="255" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>

        <rect x="648" y="330" width="44" height="12" rx="2" fill="#2d3142"/>
        <text x="670" y="339" fill="#739fdf" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VOICE</text>

