        <text x="104" y="268" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">보호자 · 아이</text>
        <text x="104" y="284" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Google account</text>

