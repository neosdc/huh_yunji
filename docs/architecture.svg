        <path d="M 576,248 H 628 Q 636,248 636,240 V 188 Q 636,180 644,180 H 700" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <!-- App -> Postgres (headline path) -->
        <line x1="576" y1="264" x2="700" y2="264" stroke="#f08a59" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
        <!-- App -> Storage -->
        <path d="M 576,280 H 628 Q 636,280 636,288 V 340 Q 636,348 644,348 H 700" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>

