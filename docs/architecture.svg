<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc" id="architecture-root">
        <title id="architecture-dark-title">구구단 놀이터 시스템 구조</title>
        <desc id="architecture-dark-desc">Architecture diagram: a static host serves index.html to the browser app, which loads play modules and voice playback, and talks to Supabase Auth, Postgres with RLS, and a private Storage bucket.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="architecture-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity="0.10"/>
          </pattern>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>
        <rect width="100%" height="100%" fill="url(#architecture-dots)" opacity="0.55"/>

        <!-- Zone: Browser -->
        <rect x="200" y="112" width="396" height="296" rx="8" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.03" stroke-opacity="0.10"/>
        <rect x="212" y="106" width="64" height="12" rx="2" fill="#2d3142"/>
        <text x="244" y="115" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.35">BROWSER</text>

        <!-- Zone: Supabase -->
        <rect x="676" y="112" width="284" height="296" rx="8" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.03" stroke-opacity="0.10"/>
        <rect x="688" y="106" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="722" y="115" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.35">SUPABASE</text>

        <!-- Arrows first (behind boxes) -->
