        <rect x="424" y="232" width="152" height="64" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1" fill-opacity="0.08"/>
        <rect x="432" y="240" width="28" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="446" y="249" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="568" y="292" fill="#f08a59" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end" fill-opacity="0.10">01</text>
        <text x="500" y="268" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">index.html</text>
        <text x="500" y="284" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gugudan·add/sub·mul</text>

