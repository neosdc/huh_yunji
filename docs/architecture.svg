        <rect x="224" y="148" width="152" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="232" y="156" width="28" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-width="0.8" stroke-opacity="0.40"/>
