        <rect x="708" y="240" width="24" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="720" y="249" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="928" y="292" fill="#f08a59" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end" fill-opacity="0.10">02</text>
        <text x="818" y="268" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">학습 데이터 (RLS)</text>
